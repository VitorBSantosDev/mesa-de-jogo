<header class="appbar">
  <a routerLink="/" class="brand">Mesa de Jogo</a>

  <nav>
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      >{{ link.label }}</a>
    }
  </nav>

  <a routerLink="/partidas/nova" class="btn primary">Registar partida</a>
</header>
